<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Calculator body - beige/cream matching --calc-body -->
  <rect width="512" height="512" rx="80" fill="#cec8b6"/>
  <!-- Highlight edge -->
  <rect x="8" y="8" width="496" height="496" rx="74" fill="none" stroke="#e4ded0" stroke-width="8"/>

  <!-- Fake solar panel strips -->
  <rect x="52" y="42" width="408" height="9" rx="3" fill="#aaa490"/>
  <rect x="52" y="57" width="408" height="6" rx="2" fill="#aaa490"/>
  <rect x="52" y="69" width="408" height="6" rx="2" fill="#aaa490"/>

  <!-- LCD bezel -->
  <rect x="44" y="90" width="424" height="152" rx="18" fill="#1a201a"/>
  <!-- LCD screen -->
  <rect x="54" y="100" width="404" height="132" rx="12" fill="#9ab888"/>
  <!-- LCD digit "100" — dark on light-green -->
  <text
    x="256" y="191"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="100" font-weight="900"
    fill="#1c3010" letter-spacing="10">100</text>

  <!-- Button grid — 4 cols × 3 rows + bottom row -->
  <!-- Row 1 -->
  <rect x="48"  y="264" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="150" y="264" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="252" y="264" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="354" y="264" width="110" height="52" rx="12" fill="#2d5030"/>

  <!-- Row 2 -->
  <rect x="48"  y="328" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="150" y="328" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="252" y="328" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="354" y="328" width="110" height="52" rx="12" fill="#2d5030"/>

  <!-- Row 3 -->
  <rect x="48"  y="392" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="150" y="392" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="252" y="392" width="90" height="52" rx="12" fill="#4a4a4a"/>
  <rect x="354" y="392" width="110" height="52" rx="12" fill="#2d5030"/>

  <!-- Bottom row: = (wide, blue) + DEL (red) -->
  <rect x="48"  y="458" width="294" height="62" rx="14" fill="#1a3e88"/>
  <rect x="354" y="458" width="110" height="62" rx="14" fill="#7a2010"/>
</svg>
