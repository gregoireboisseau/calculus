<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background for maskable (OS can clip to any shape) -->
  <rect width="512" height="512" fill="#cec8b6"/>

  <!-- Calculator body slightly inset to stay within safe zone -->
  <rect x="32" y="32" width="448" height="448" rx="70" fill="#cec8b6"/>
  <rect x="38" y="38" width="436" height="436" rx="66" fill="none" stroke="#e4ded0" stroke-width="7"/>

  <!-- Fake solar panel strips -->
  <rect x="68" y="58" width="376" height="8" rx="3" fill="#aaa490"/>
  <rect x="68" y="72" width="376" height="5" rx="2" fill="#aaa490"/>
  <rect x="68" y="83" width="376" height="5" rx="2" fill="#aaa490"/>

  <!-- LCD bezel -->
  <rect x="62" y="102" width="388" height="136" rx="16" fill="#1a201a"/>
  <!-- LCD screen -->
  <rect x="71" y="111" width="370" height="118" rx="10" fill="#9ab888"/>
  <!-- LCD digit -->
  <text
    x="256" y="194"
    text-anchor="middle"
    font-family="'Courier New', Courier, monospace"
    font-size="86" font-weight="900"
    fill="#1c3010" letter-spacing="8">100</text>

  <!-- Buttons - rows 1-3 -->
  <rect x="62"  y="258" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="152" y="258" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="242" y="258" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="332" y="258" width="118" height="46" rx="10" fill="#2d5030"/>

  <rect x="62"  y="314" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="152" y="314" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="242" y="314" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="332" y="314" width="118" height="46" rx="10" fill="#2d5030"/>

  <rect x="62"  y="370" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="152" y="370" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="242" y="370" width="78" height="46" rx="10" fill="#4a4a4a"/>
  <rect x="332" y="370" width="118" height="46" rx="10" fill="#2d5030"/>

  <!-- Bottom row -->
  <rect x="62"  y="426" width="258" height="58" rx="12" fill="#1a3e88"/>
  <rect x="332" y="426" width="118" height="58" rx="12" fill="#7a2010"/>
</svg>
